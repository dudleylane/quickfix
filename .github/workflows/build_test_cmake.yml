name: Build with CMake

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build + tests (${{ matrix.configuration }})
    runs-on: [self-hosted, Linux, X64, quickfix-dev]
    # gcc-toolset-15 is required: Stream 10's default is GCC 14, which lacks
    # <flat_map>.  No `source enable` script exists at the standard path on
    # Stream 10 — the SCL way is `scl enable …`, but env vars achieve the
    # same effect across every step without wrapping each command.
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DHAVE_SSL=ON

      - name: Build
        shell: bash
        run: cmake --build build -j"$(nproc)"

      - name: Run unit tests
        # ut/at/pt symlinks land at <repo>/test/{ut,at,pt} via the custom
        # CMake symlink targets in src/CMakeLists.txt and src/C++/test/
        # CMakeLists.txt — same paths whether the build is in-tree or
        # out-of-tree.
        working-directory: ./test
        run: ./ut --quickfix-config-file cfg/ut.cfg --quickfix-spec-path ../spec

      - name: Compile the SWIG bindings
        # No CMake target builds the checked-in SWIG output, so it drifted 33
        # commits out of date before 4cb3d655 and nobody noticed. Both failures
        # that caused were compile errors -- FieldMap's group container became a
        # std::flat_map, and getFixString started returning by value -- so
        # compiling the two translation units catches the class of rot that
        # actually bit. It does not catch new API that was never exposed;
        # regenerate-and-diff would, at the cost of pinning CI to one SWIG
        # version.
        #
        # -Isrc/swig supplies MySQLStubs.h, which the -DHAVE_MYSQL
        # -DHAVE_POSTGRESQL in swig.sh make the generated code include. The
        # interpreter header paths are queried rather than hardcoded so a Python
        # or Ruby point release does not turn this red. $CXX rather than g++:
        # the job env puts gcc-toolset-15 first on PATH, but FieldMap.h needs
        # <flat_map>, so naming the compiler the job configured with is what
        # keeps this from silently depending on PATH order. Debug-only: the
        # result does not depend on the configuration, and each file takes ~8s.
        if: matrix.configuration == 'Debug'
        shell: bash
        run: |
          python_include=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["include"])')
          ruby_dirs=$(ruby -e 'require "rbconfig"; print RbConfig::CONFIG["rubyhdrdir"], " ", RbConfig::CONFIG["rubyarchhdrdir"]')
          ruby_flags=""
          for dir in $ruby_dirs; do ruby_flags="$ruby_flags -I$dir"; done
          "$CXX" -std=c++23 -fsyntax-only -Iinclude -Isrc/C++ -Isrc/swig \
              -I"$python_include" src/python/QuickfixPython.cpp
          "$CXX" -std=c++23 -fsyntax-only -Iinclude -Isrc/C++ -Isrc/swig \
              $ruby_flags src/ruby/QuickfixRuby.cpp

      - name: Run acceptance tests
        # PR-only: the at-driven Ruby runner takes ~2 minutes and isn't
        # informative on every push to master.
        if: github.event_name == 'pull_request'
        working-directory: ./test
        run: ./runat.sh 54321

      - name: Run performance tests
        # Release-only: pt benchmarks against the Debug build are noise.
        if: matrix.configuration == 'Release'
        working-directory: ./test
        # -r 1: this step is a smoke test for crashes and hangs, not a
        # regression gate, so it does not need the repetition harness's
        # default of 5 runs per benchmark.
        run: ./pt -p 54323 -c 500000 -r 1
