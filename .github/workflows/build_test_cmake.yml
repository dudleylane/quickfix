name: Build with CMake

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build + tests (${{ matrix.configuration }})
    runs-on: [self-hosted, Linux, X64, quickfix-dev]
    # gcc-toolset-15 is required: Stream 10's default is GCC 14, which lacks
    # <flat_map>.  No `source enable` script exists at the standard path on
    # Stream 10 — the SCL way is `scl enable …`, but env vars achieve the
    # same effect across every step without wrapping each command.
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DHAVE_SSL=ON \
            -DHAVE_PYTHON3=${{ matrix.configuration == 'Debug' && 'ON' || 'OFF' }}

      - name: Build
        shell: bash
        run: cmake --build build -j"$(nproc)"

      - name: Run unit tests
        # ut/at/pt symlinks land at <repo>/test/{ut,at,pt} via the custom
        # CMake symlink targets in src/CMakeLists.txt and src/C++/test/
        # CMakeLists.txt — same paths whether the build is in-tree or
        # out-of-tree.
        working-directory: ./test
        run: ./ut --quickfix-config-file cfg/ut.cfg --quickfix-spec-path ../spec

      - name: Build and test the Ruby bindings
        # Replaces an -fsyntax-only check of QuickfixRuby.cpp. Ruby has no CMake
        # path, so this runs the project's own build script -- extconf.rb
        # through mkmf -- which is what #6 fixed: mkmf compiled its probes with
        # Ruby's baked-in RPM hardening flags, whose annobin plugin cannot load
        # into gcc-toolset-15, and extconf.rb silently discarded the CXXFLAGS
        # and LIBS that make_ruby.sh passes it, so the module was built without
        # -std=c++23.
        #
        # Building and then running the suite is strictly stronger than a syntax
        # check, and it keeps the documented build honest: if make_ruby.sh
        # breaks again, this goes red rather than a direct g++ command quietly
        # covering for it.
        #
        # Needs rubygem-test-unit on the runner -- Ruby 3.3 no longer bundles
        # test/unit. libquickfix comes from lib/, which the Build step fills.
        if: matrix.configuration == 'Debug'
        working-directory: ./src/ruby
        shell: bash
        run: |
          bash make_ruby.sh "$CXX" "-std=c++23 -DHAVE_SSL=1" "-lssl -lcrypto"
          export LD_LIBRARY_PATH="${{ github.workspace }}/lib:$LD_LIBRARY_PATH"
          ruby -I . test/TestSuite.rb

      - name: Compile the database backends
        # Nothing compiles MySQLStore/Log, PostgreSQLStore/Log or OdbcStore/Log
        # on any push -- CI never sets HAVE_MYSQL, HAVE_POSTGRESQL or HAVE_ODBC
        # -- so they can stop compiling and every job stays green. That is what
        # happened to the SWIG wrappers, which went 33 commits broken before
        # anyone noticed, and all six of these were last touched by 6ff4a20f, a
        # scripted tree-wide edit that silently damaged other files it touched.
        #
        # A syntax check rather than a CMake build with the options on. Enabling
        # them pulls in 4 test cases needing live database servers (ut goes
        # 56 -> 60, and the new ones fail with "Unable to connect to postgres
        # database"), and configure_file would rewrite the *tracked*
        # src/C++/config.h. A second full build costs ~2m per push on a runner
        # that already shares this machine, to guard leaf implementations whose
        # realistic breakage -- a MessageStore or Log interface they no longer
        # satisfy -- is a compile error. The limit: this does not link, so a
        # missing symbol would still pass.
        #
        # The grep is not redundant. The -D is load-bearing: without it each
        # file is entirely #ifdef'd out and "compiles" in 12ms instead of ~3s,
        # so if the guard macro were ever renamed this step would keep passing
        # while checking nothing.
        #
        # Runner needs unixODBC-devel, libpq5-devel and mariadb-connector-c-devel.
        # The last provides /usr/include/mysql/mysql.h, which is the MySQL C API
        # that MySQLConnection.h's `#include <mysql.h>` wants; it is an
        # API-compatible replacement for libmysqlclient rather than the same
        # library, which a syntax check cannot tell apart from the real thing --
        # another reason this does not stand in for linking.
        if: matrix.configuration == 'Debug'
        shell: bash
        run: |
          set -u
          # Queried, not hardcoded, like the Ruby step's header paths.
          mysql_include=$(mysql_config --include)
          check() {
            macro=$1; extra=$2; shift 2
            for src in "$@"; do
              grep -q "$macro" "src/C++/$src.cpp" \
                || { echo "::error::$src.cpp no longer mentions $macro -- this step would check nothing"; exit 1; }
              # $extra is deliberately unquoted: it carries several -I flags.
              "$CXX" -std=c++23 -fsyntax-only "-D$macro=1" -DHAVE_SSL=1 \
                  -Iinclude -Isrc/C++ $extra "src/C++/$src.cpp"
            done
          }
          check HAVE_ODBC       ""                OdbcStore OdbcLog
          check HAVE_POSTGRESQL ""                PostgreSQLStore PostgreSQLLog
          check HAVE_MYSQL      "$mysql_include"  MySQLStore MySQLLog

      - name: Link the database backends
        # The per-push step above syntax-checks these six files, which proves
        # they parse against their headers and never resolves a symbol. That
        # matters most for MySQL: the headers come from mariadb-connector-c,
        # an API-compatible *replacement* for libmysqlclient rather than the
        # same library -- /usr/lib64/libmysqlclient_r.so is a symlink to
        # libmariadb.so.3 -- so a function present in the header but absent from
        # the shared object is exactly what a syntax check cannot catch and a
        # link can.
        #
        # PR-only, like the acceptance suite. A second full build costs ~2m15s,
        # too much on every push for drift that only needs catching before a
        # merge; the syntax check stays as the fast per-push guard.
        #
        # ut is deliberately not run in this configuration: enabling the
        # backends adds four test cases that require live database servers.
        # This proves the symbols exist, not that they behave.
        #
        # Runner needs mariadb-connector-c-devel, libpq5-devel, unixODBC-devel.
        if: github.event_name == 'pull_request' && matrix.configuration == 'Debug'
        shell: bash
        run: |
          # Its own build dir and output dir: the ut/at/pt symlink targets are
          # unconditional, so a second tree would otherwise steal them from the
          # build the later steps use.
          cmake -B build-db -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHAVE_SSL=ON -DHAVE_MYSQL=ON -DHAVE_POSTGRESQL=ON -DHAVE_ODBC=ON \
            -DQUICKFIX_LIB_OUTPUT_DIR="${{ github.workspace }}/build-db/out"
          cmake --build build-db -j"$(nproc)"

          # Exiting 0 is not the check: confirm the backends were really linked
          # in, rather than the options having been silently ignored.
          lib=$(find build-db/out -name 'libquickfix.so.*' -type f | head -1)
          for want in libmariadb libpq libodbc; do
            ldd "$lib" | grep -q "$want" \
              || { echo "::error::$want is not linked into $lib"; exit 1; }
          done

          # configure_file rewrote the *tracked* src/C++/config.h to define
          # HAVE_MYSQL and friends. Harmless on a fresh checkout, but left dirty
          # it misleads whatever runs next and anyone copying this recipe.
          git checkout -- src/C++/config.h

      - name: Run the Python binding tests
        # Compiling and linking the wrapper proves it builds, not that it works.
        # A %ignore that removes something callers use, a typemap that marshals
        # a field wrongly, a director that stops dispatching -- none of those is
        # a compile error. These 32 tests pass, but until now they ran nowhere
        # automatic, which is the same gap that left the wrappers broken for 33
        # commits, one level up.
        #
        # Debug-only because lib/_quickfix.so exists only there: HAVE_PYTHON3 is
        # ON in Debug and OFF in Release. LD_LIBRARY_PATH is *prepended*, not
        # assigned -- the job env already points it at gcc-toolset-15's lib64,
        # which libquickfix.so.17 needs at load time as well.
        #
        # Ruby has no equivalent step: its module cannot be built here at all.
        # make_ruby.sh -> extconf.rb -> mkmf fails with "inaccessible plugin
        # file plugin/gcc-annobin.so", because mkmf bakes in Ruby's RPM
        # hardening specs, whose annobin plugin exists only for the system GCC
        # 14 -- and GCC 14 cannot compile this tree, which needs <flat_map>.
        # Building it with a direct g++ command instead would turn this green
        # while the documented build stayed broken, so it is tracked as an issue
        # rather than papered over.
        if: matrix.configuration == 'Debug'
        working-directory: ./src/python
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/lib:${{ github.workspace }}/src/python
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/lib:$LD_LIBRARY_PATH"
          python3 -m unittest discover -s test -p '*TestCase.py' -v

      - name: Run acceptance tests
        # PR-only: the at-driven Ruby runner takes ~2 minutes and isn't
        # informative on every push to master.
        if: github.event_name == 'pull_request'
        working-directory: ./test
        run: ./runat.sh 54321

      - name: Run performance tests
        # Release-only: pt benchmarks against the Debug build are noise.
        if: matrix.configuration == 'Release'
        working-directory: ./test
        # -r 1: this step is a smoke test for crashes and hangs, not a
        # regression gate, so it does not need the repetition harness's
        # default of 5 runs per benchmark.
        run: ./pt -p 54323 -c 500000 -r 1
