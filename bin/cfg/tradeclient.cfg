[DEFAULT]
ConnectionType=initiator
ReconnectInterval=2
FileStorePath=store
FileLogPath=log
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=../spec/FIX42.xml
HttpAcceptPort=9911
# An SSL initiator verifies the server's certificate against this CA, or the
# system trust store if unset, and checks it names SocketConnectHost.
CertificationAuthoritiesFile=./cfg/certs/certs/cacert.pem
#ClientCertificateFile=./cfg/certs/127_0_0_1_client.crt
#ClientCertificateKeyFile=./cfg/certs/127_0_0_1_client.key
SSLProtocol = all
TimestampPrecision=6
PreserveMessageFieldsOrder=N

# standard config elements

[SESSION]
# inherit ConnectionType, ReconnectInterval and SenderCompID from default
BeginString=FIX.4.2
SenderCompID=CLIENT1
TargetCompID=EXECUTOR
SocketConnectHost=127.0.0.1
SocketConnectPort=5001
SocketConnectHost1=127.0.0.1
SocketConnectPort1=5002
SocketConnectHost2=127.0.0.1
SocketConnectPort2=5003
HeartBtInt=30 

[SESSION]
# inherit ConnectionType, ReconnectInterval and SenderCompID from default
BeginString=FIX.4.2
SenderCompID=CLIENT2
TargetCompID=EXECUTOR
SocketConnectHost=127.0.0.1
SocketConnectPort=5001
HeartBtInt=30 